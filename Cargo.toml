[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
cof-core = { path = "crates/cof-core" }
rand = "0.10.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
directories = "6.0.0"
ron = "0.12.2"
thiserror = "2.0.21"
tempfile = "3.27.0"
