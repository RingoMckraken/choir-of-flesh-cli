[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
cof-core = { path = "crates/cof-core" }
rand = "0.10.1"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "serde", "std"] }
directories = "6"
ron = "0.12"
thiserror = "2.0.17"
tempfile = "3.23.0"
